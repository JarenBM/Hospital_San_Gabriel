<nav class="sigih-paginador" aria-label="Paginación del listado">
  <span class="sigih-contador">
    @if (total() > 0) {
      Mostrando {{ desde() }}–{{ hasta() }} de {{ total() }}
    } @else {
      Sin resultados
    }
  </span>

  <ul class="pagination pagination-sm mb-0">
    <li class="page-item" [class.disabled]="anteriorDeshabilitado()">
      <button
        type="button"
        class="page-link"
        [disabled]="anteriorDeshabilitado()"
        (click)="ir(pagina() - 1)"
        aria-label="Página anterior"
      >
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
    </li>
    <li class="page-item disabled">
      <span class="page-link">Página {{ pagina() }} de {{ totalPaginas() }}</span>
    </li>
    <li class="page-item" [class.disabled]="siguienteDeshabilitado()">
      <button
        type="button"
        class="page-link"
        [disabled]="siguienteDeshabilitado()"
        (click)="ir(pagina() + 1)"
        aria-label="Página siguiente"
      >
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </li>
  </ul>
</nav>
