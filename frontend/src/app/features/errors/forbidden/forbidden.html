<main class="error">
  <div class="error__tarjeta card sigih-card">
    <div class="card-body p-4 p-sm-5">
      <span class="error__codigo">403</span>
      <span class="error__icono" aria-hidden="true">
        <i class="bi bi-shield-lock"></i>
      </span>

      <h1 class="error__titulo">Acceso prohibido</h1>

      <p class="error__mensaje">
        Su usuario no tiene los permisos necesarios para abrir esta sección.
        Si cree que se trata de un error, contacte al administrador del sistema.
      </p>

      <div class="error__contexto">
        <span class="sigih-badge-permiso">
          <i class="bi bi-person-badge"></i>
          {{ nombre() }}
        </span>
        <span class="sigih-badge-permiso">
          <i class="bi bi-shield-check"></i>
          {{ rolActual() ?? 'Sin rol' }}
        </span>
      </div>

      <div class="error__acciones">
        <a class="btn btn-primary" [routerLink]="rutaInicio()">
          <i class="bi bi-house-door me-2"></i>
          Volver al inicio
        </a>
        <button type="button" class="btn btn-outline-secondary" (click)="cerrarSesion()">
          <i class="bi bi-box-arrow-right me-2"></i>
          Iniciar sesión con otra cuenta
        </button>
      </div>

      <p class="error__nota">
        <i class="bi bi-info-circle me-1"></i>
        Los permisos se asignan por rol y se validan en el servidor.
      </p>
    </div>
  </div>
</main>
